/* ======================= CÁMARA INSTANTÁNEA (fotos Polaroid) ======================= */
const POL={ state:0, t0:0, cv:null, blob:null, mode:'user', pid:null,
            yes:null, askSaid:false, shook:false };
function cmdFoto(mode,pid){
  if(POL.state!==0) return;
  if(!VS.on || CAMV.readyState<2){
    react(gen('shrug')); say(pick(['No veo nada...','Sin cámara no puedo.'])); return;
  }
  POL.mode=mode; POL.pid=pid||null; POL.yes=null; POL.askSaid=false; POL.shook=false;
  POL.state=1; POL.t0=TT;
  react(gen('fotoCam'));
}
function polTick(t){
  if(POL.state===0) return;
  const el=t-POL.t0, g=faceGeo();
  if(POL.state===1){                                   // cámara, flash y clic
    if(!POL.cv && el>.45){
      const w=CAMV.videoWidth||320, h=CAMV.videoHeight||240;
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(CAMV,0,0,w,h);
      POL.cv=c;
      c.toBlob(b=>{ POL.blob=b; },'image/png');
      SND.shutter(1); vib(30);
    }
    if(el>1.3){ POL.state=2; POL.t0=t; react(gen('shakeCard')); SND.eject(1); }
  }
  else if(POL.state===2){                              // la escupe y la sacude
    if(el>.9 && !POL.shook){ POL.shook=true; react(gen('shakeCard')); }
    if(el>2){ POL.state=3; POL.t0=t; SND.fizz(.8); }
  }
  else if(POL.state===3){                              // se revela poco a poco
    if(el>2.6){
      POL.state=4; POL.t0=t;
      if(VOZ.ok===false && !('speechSynthesis' in window)){ POL.yes=true; }
      else {
        if(VOZ.ok===null) vozInit();
        srStart('talk'); VOICE.askedQ=true; VOICE.heard=false; VOICE.talkT=t; VOICE.silentT=t;
        say(pick(['¿Te gusta? ¿La guardamos?','¿Qué tal ha quedado? ¿La guardo?','¿La guardamos?']));
      }
    }
  }
  else if(POL.state===4){                              // esperando tu sí / no
    if(POL.yes===true) savePhotoNow();
    else if(POL.yes===false || el>9){
      POL.state=5; POL.t0=t; SND.whiffle(1); react(gen('pout'));  // la tira
    }
  }
  else if(POL.state===5){
    if(el>1) polClear();
  }
  drawPOL(t);
}
async function savePhotoNow(){
  const rec={ id:'f'+Date.now(), ts:Date.now(), kind:POL.mode, pid:POL.pid };
  if(POL.blob){
    rec.blob=POL.blob;
    try{ await idbPut(rec); }catch(e){}
    if(POL.mode==='person' && POL.pid){
      const p=DB.persons.find(x=>x.id===POL.pid);
      if(p){ p.photoId=rec.id; dbDirty=true; }
      setTimeout(()=>askNameFor(POL.pid), 800);        // foto lista → ¿cómo te llamas?
    }
    if(POL.mode==='user'){
      shareOrDownload(POL.blob);                       // a la galería vía compartir/descarga
      say(pick(['¡Guardada!','¡Lista! Guardada en mi memoria.','¡Guardada! Qué foto más bonita.']));
    }
  }
  react(gen('loveSoft'));
  polClear();
}
function polClear(){
  POL.state=0; POL.cv=null; POL.blob=null; POL.yes=null; POL.shook=false;
  VOICE.askedQ=false;
  if(SR_.mode==='talk') srStart('wake');
}
async function shareOrDownload(blob){
  const ts=Date.now();
  try{
    if(navigator.canShare){
      const f=new File([blob],'chispi-'+ts+'.png',{type:'image/png'});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; }
    }
  }catch(e){ return; }
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='chispi-'+ts+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){}
}
function drawPOL(t){
  if(POL.state===0) return;
  const el=t-POL.t0, g=faceGeo(), R=g.R;
  if(POL.state===1){                                   // cámara instantánea adorable
    const s=eEl(clamp(el/.3,0,1));
    const cx=g.x+R*1.15, cy=g.y+R*.35;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(Math.max(.01,s),Math.max(.01,s));
    ctx.fillStyle='#ef6d6d'; rr(-R*.34,-R*.24,R*.68,R*.48,R*.1);
    ctx.fillStyle='#f7f2ea'; rr(-R*.34,-R*.24,R*.68,R*.14,R*.1);
    ctx.fillStyle='#2c3242'; ctx.beginPath(); ctx.arc(0,0,R*.16,0,TAU); ctx.fill();
    ctx.fillStyle='#55e0a8'; ctx.beginPath(); ctx.arc(0,0,R*.1,0,TAU); ctx.fill();
    ctx.fillStyle='#1c2130'; ctx.beginPath(); ctx.arc(0,0,R*.05,0,TAU); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(R*.05,-R*.05,R*.02,0,TAU); ctx.fill();
    ctx.fillStyle='#2c3242'; rr(R*.14,-R*.2,R*.12,R*.06,R*.02);
    ctx.restore();
    if(el>.42 && el<.62){                              // FLASH
      ctx.fillStyle='rgba(255,255,255,'+(1-(el-.42)/.2)+')';
      ctx.fillRect(0,0,V.w,V.h);
    }
    return;
  }
  const cw=Math.min(V.w,V.h)*.46, ch2=cw*1.14;
  let cx=g.x+R*.5, cy, rot=Math.sin(t*1.3)*.04, alpha=1;
  if(POL.state===2){                                   // sale disparada de la cámara
    const u=eIO(clamp(el/1,0,1));
    cx=lerp(g.x+R*1.15, g.x, u); cy=lerp(g.y+R*.35, g.y-R*.15, u);
    rot=Math.sin(el*9)*.14*(1-u*.6);
  } else cy=g.y-R*.15;
  if(POL.state===5){                                   // a la basura, girando
    const u2=clamp(el/1,0,1);
    cx=g.x+R*.5+u2*u2*V.w*.6;
    cy=g.y-R*.15 - u2*V.h*.35 + u2*u2*V.h*.55;
    rot=u2*5; alpha=1-u2;
  }
  const dev = POL.state===3 ? clamp(el/2.4,0,1) : (POL.state<=2 ? 0 : 1);
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.fillStyle='#faf7f0'; rr(-cw/2,-ch2/2,cw,ch2,cw*.04);
  ctx.fillStyle='#151a26'; rr(-cw*.42,-ch2*.42,cw*.84,cw*.84,cw*.02);
  if(POL.cv && dev>0){
    ctx.globalAlpha=alpha*clamp(dev,.03,1);
    const iw=cw*.84;
    ctx.drawImage(POL.cv, -iw/2, -ch2*.42, iw, iw*(POL.cv.height/POL.cv.width));
  }
  ctx.globalAlpha=alpha;
  ctx.restore();
  ctx.globalAlpha=1;
}

/* ======================= MANOS Y TELEQUINESIS (visión ligera, sin ML) ======================= */
/* Detección por color de piel a 80x60 con componentes conexos: mano abierta,
   alejar (telequinesis), puño, palma quieta, saludo, seguimiento, corazón con
   dos manos y aproximaciones de paz/pulgar. Si la mano no es clara → no reacciona. */
const HAND={ next:0, hist:[], telek:false, telekT:0, cool:{} };
const hc=document.createElement('canvas'); hc.width=80; hc.height=60;
const hctx=hc.getContext('2d',{willReadFrequently:true});
const hmask=new Uint8Array(80*60);
const hlab=new Int16Array(80*60);
function skinMask(){
  hctx.drawImage(CAMV,0,0,80,60);
  const d=hctx.getImageData(0,0,80,60).data;
  for(let i=0;i<4800;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2];
    hmask[i]=(r>70 && r>g*1.12 && r>b*1.25 && (r-g)>14 && (r-b)>22)?1:0;
  }
}
function comps(){
  hlab.fill(-1); const out=[];
  for(let i=0;i<4800;i++){
    if(hmask[i] && hlab[i]<0){
      const id=out.length, stack=[i]; hlab[i]=id;
      let n=0,sx=0,sy=0,minX=80,minY=60,maxX=0,maxY=0;
      while(stack.length){
        const p=stack.pop(), x=p%80, y=(p/80)|0;
        n++; sx+=x; sy+=y;
        if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        if(x>0  && hmask[p-1]  && hlab[p-1]<0){ hlab[p-1]=id; stack.push(p-1); }
        if(x<79 && hmask[p+1]  && hlab[p+1]<0){ hlab[p+1]=id; stack.push(p+1); }
        if(y>0  && hmask[p-80] && hlab[p-80]<0){ hlab[p-80]=id; stack.push(p-80); }
        if(y<59 && hmask[p+80] && hlab[p+80]<0){ hlab[p+80]=id; stack.push(p+80); }
      }
      out.push({n,cx:sx/n,cy:sy/n,minX,minY,maxX,maxY,w:maxX-minX+1,h:maxY-minY+1});
    }
  }
  return out;
}
function pickHand(cs){                                 // excluye la candidata a "cabeza"
  let bi=-1,bn=0;
  for(let i=0;i<cs.length;i++){
    const c=cs[i], cxn=c.cx/80, cyn=c.cy/60;
    const isHead = c.n>500 && Math.abs(cxn-.5)<.18 && cyn<.5;
    if(isHead) continue;
    if(c.n>bn){ bn=c.n; bi=i; }
  }
  if(bi<0 || bn<70 || bn>2600) return null;
  const c=cs[bi]; c.fill=c.n/(c.w*c.h);
  return c;
}
function gestureCool(k,cd){ const t=TT; if(t-(HAND.cool[k]||0)<cd) return false; HAND.cool[k]=t; return true; }
function handHistPush(v){ HAND.hist.push(v); if(HAND.hist.length>10) HAND.hist.shift(); }
function handMaxArea(n){ let m=0; const h=HAND.hist;
  for(let i=Math.max(0,h.length-n);i<h.length;i++) if(h[i]) m=Math.max(m,h[i].area);
  return m; }
function topLobes(c){
  const y0=c.minY, y1=Math.min(59,c.minY+Math.max(2,Math.floor(c.h/4)));
  let runs=0, inRun=false;
  for(let x=c.minX;x<=c.maxX;x++){
    let filled=false;
    for(let y=y0;y<y1;y++) if(hmask[y*80+x]){ filled=true; break; }
    if(filled && !inRun){ runs++; inRun=true; }
    if(!filled) inRun=false;
  }
  return runs;
}
function telekOff(surprise){
  if(!HAND.telek) return;
  HAND.telek=false;
  react(gen('telekEnd',{surprise:surprise}));
}
function handTick(){
  const t=TT;
  skinMask();
  const cs=comps();
  // corazón con las dos manos
  if(!HAND.telek){
    const ab=cs.filter(c=>c.n>120 && c.n<2200 && c.cy<38);
    if(ab.length>=2){
      const a=ab[0], b=ab[1];
      if(Math.abs(a.cy-b.cy)<9 && Math.abs(a.cx-b.cx)>12 && Math.abs(a.cx-b.cx)<42
         && Math.abs(a.n-b.n)<a.n*.6 && gestureCool('heart',9)){
        handHistPush(null); telekOff(true);
        E.happy=1; react(gen('loveSoft'));
        say(pick(['¡Aww! ¡Qué bonito!','¡Corazóooon!']));
        return;
      }
    }
  }
  const c=pickHand(cs);
  if(!c){ handHistPush(null); telekOff(false); return; }
  const open=c.fill>.3 && (c.w>14 || c.h>14);
  const cxn=c.cx/80, cyn=c.cy/60;
  handHistPush({x:cxn,y:cyn,area:c.n,open:open,t:t});
  GAZE.pt={ x:(1-cxn)*V.w, y:cyn*V.h*.9 };             // la sigue con los ojos
  // saludo: vaivén rápido con mano abierta
  if(open && HAND.hist.length>=5){
    let ch=0, lx=0;
    for(let i=4;i<HAND.hist.length;i++){
      const a=HAND.hist[i-1], b=HAND.hist[i];
      if(!a || !b) continue;
      const dxt=b.x-a.x;
      if(lx!==0 && ((dxt>0)!==(lx>0)) && Math.abs(dxt)>.03) ch++;
      if(Math.abs(dxt)>.02) lx=dxt>0?1:-1;
    }
    if(ch>=3 && gestureCool('wave',8)){
      const nm=currentPersonName();
      react(gen('waveHi'));
      say(pick(['¡Hola'+(nm?', '+nm:'')+'!','¡Hey!','¡Hola, hola!']));
    }
  }
  // puño → susto
  if(!open && c.fill>.5 && c.n<900 && c.w<16 && c.h<16 && gestureCool('fist',7)){
    E.fear=clamp(E.fear+.3,0,1); react(gen('scare'));
    say(pick(['¡Eh! Tranqui...','¡No me pegues!']));
  }
  // palma quieta 2 s → zen
  if(open && HAND.hist.length>=6 && !HAND.telek){
    const hi=HAND.hist.slice(-6); let all=true;
    for(let i=2;i<hi.length;i++)
      if(!hi[i]||!hi[i-1]||Math.abs(hi[i].x-hi[i-1].x)>.02||Math.abs(hi[i].y-hi[i-1].y)>.02) all=false;
    if(all && gestureCool('palm',14)) react(gen('zen'));
  }
  // paz / pulgar (lóbulos del cuarto superior, solo con umbral alto)
  if(open && !HAND.telek){
    const lob=topLobes(c);
    if(lob===2 && gestureCool('peace',9)){ react(gen('back')); say(pick(['¡Paz!','¡Yupi!'])); }
    else if(lob===1 && c.fill>.42 && gestureCool('thumb',9)){
      E.happy=clamp(E.happy+.2,0,1); react(gen('back')); say(pick(['¡Genial!','¡Bien!']));
    }
  }
  // TELEQUINESIS: mano abierta que se aleja (el área cae)
  if(open && HAND.hist.length>=6 && !HAND.telek){
    const old=handMaxArea(6);
    if(old>0 && c.n<old*.76 && gestureCool('telek',3)){
      HAND.telek=true; HAND.telekT=t;
      SND.whoosh(.8); vib([30,40,30]);
    }
  }
  if(HAND.telek && (!open || c.n>handMaxArea(6)*.92)) telekOff(false);
}
const FXA=[];
function fxRing(){
  const g=faceGeo();
  FXA.push({k:'ring',x:g.x+HEAD.x,y:g.y+HEAD.y,r:g.R*.5,t:0,life:.8});
  if(FXA.length>24) FXA.shift();
}
function fxTick(dt){
  for(let i=FXA.length-1;i>=0;i--){
    const f=FXA[i]; f.t+=dt; f.r+=dt*faceGeo().R*2.2;
    if(f.t>f.life) FXA.splice(i,1);
  }
}
function fxDraw(){
  for(const f of FXA){
    if(f.k==='ring'){
      const a=(1-f.t/f.life)*.5;
      ctx.strokeStyle='rgba(139,233,253,'+a+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.stroke();
    }
  }
}
function telekTick(t,dt){ // ojos estirados hacia ti, vibración y ondas
  if(!HAND.telek) return;
  const s=clamp((t-HAND.telekT)/1.2,0,1);
  const tgt=1.25+s*.25;
  P.l.sx=lerp(P.l.sx,tgt,.35); P.r.sx=lerp(P.r.sx,tgt,.35);
  P.l.sy=lerp(P.l.sy,tgt*1.05,.3); P.r.sy=lerp(P.r.sy,tgt*1.05,.3);
  P.l.pr=lerp(P.l.pr,1.3,.3);  P.r.pr=lerp(P.r.pr,1.3,.3);
  P.shake=Math.max(P.shake,.25+s*.2);
  P.y-=s*.6;
  if(Math.random()<dt*6) fxRing();
  if(Math.random()<dt*3) vib(6);
}

/* ======================= TICK EXTENDIDO (voz, fotos, manos, actividad) ======================= */
const _TICK=TICK;
TICK=function(dt,t){
  _TICK(dt,t);                                  // emociones, visión, pose y render base
  voiceTick(t);                                 // wake word / sesiones / pausas de noche
  actTick(t);                                   // retoma su actividad mientras habláis
  polTick(t);                                   // máquina de estados de la Polaroid
  if(VS.on && VS.presence && MODE==='run' && !document.hidden && t-HAND.next>.45){
    HAND.next=t;                                // manos: solo con persona y a ~2 Hz
    try{ handTick(); }catch(e){}
  }
  talkMouthTick(t);                             // boca sincronizada al hablar
  telekTick(t,dt);
  fxTick(dt);                                   // ondas de telequinesis
  fxDraw();
};

/* ======================= GANCHOS DE ARRANQUE (voz) ======================= */
/* El primer toque desbloquea audio y micro (política de los navegadores). */
addEventListener('pointerdown',()=>{ vozInit(); },{capture:true,once:true});
setTimeout(()=>{ vozInit(); }, 9500);           // y un intento tras pedir la cámara
